{% extends "dashboard/base.html" %}

{% block titulo %}Registro - SIWEBA{% endblock %}
{% block encabezado %}Crear Nueva Cuenta{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm mt-4">
            <div class="card-body p-4">
                <h4 class="card-title text-center mb-4">Registro de Usuario</h4>
                
                <form method="post" action="{% url 'registro' %}">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100 mt-3">Crear Cuenta</button>
                </form>

                <hr class="my-4">
                <p class="text-center mb-0">
                    ¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
